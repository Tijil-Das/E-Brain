name = "ebrain-orchestrator"
main = "worker.js"
compatibility_date = "2024-01-01"

account_id = "REPLACE_WITH_YOUR_CLOUDFLARE_ACCOUNT_ID"

[[kv_namespaces]]
binding = "EBRAIN_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets — set via:
#   npx wrangler secret put HEARTBEAT_TOKEN
#   npx wrangler secret put DASHBOARD_TOKEN
#   npx wrangler secret put TELEGRAM_BOT_TOKEN    (optional)
#   npx wrangler secret put TELEGRAM_CHAT_ID      (optional)
