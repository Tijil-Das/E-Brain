name: E-Brain Phase 0 Benchmark

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to authorize GPU spend (~1 h, T4). Any other value aborts.'
        required: true
        default: ''

jobs:
  phase0:
    name: Phase 0 — benchmark + probes
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Guard — refuse if already done ─────────────────────────────────
      - name: Guard — refuse if phase0_results.txt already exists
        run: |
          if [ -f "orchestrator/phase0_benchmark/results/phase0_results.txt" ]; then
            echo "ERROR: orchestrator/phase0_benchmark/results/phase0_results.txt already exists."
            echo "Phase 0 has already run. Remove that file from the repo to re-run."
            exit 1
          fi
          echo "Guard passed — results file does not exist."

      # ── 3. Confirm input ───────────────────────────────────────────────────
      - name: Check confirm input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "yes" ]; then
            echo "ERROR: Input confirm='${{ github.event.inputs.confirm }}' — must be exactly 'yes'."
            echo "Re-trigger the workflow and type 'yes' in the confirm field."
            exit 1
          fi
          echo "Confirmed."

      # ── 4. Install Kaggle CLI (< 2.0.0 — no browser OAuth) ────────────────
      - name: Install Kaggle CLI
        run: pip install "kaggle<2.0.0" --quiet

      # ── 5. Configure Kaggle credentials ───────────────────────────────────
      #    Credentials come from GitHub Secrets ONLY. Never in YAML.
      - name: Configure Kaggle credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          printf '{"username":"%s","key":"%s"}\n' "$KAGGLE_USERNAME" "$KAGGLE_KEY" \
            > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          echo "Kaggle credentials written."

      # ── 6. Inject username into kernel-metadata.json ──────────────────────
      - name: Inject username into kernel metadata
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          python - <<'EOF'
          import json, os, pathlib
          meta_path = pathlib.Path("orchestrator/phase0_benchmark/kernel-metadata.json")
          meta = json.loads(meta_path.read_text())
          u = os.environ["KAGGLE_USERNAME"]
          meta["id"] = meta["id"].replace("TRAINING_KAGGLE_USERNAME", u)
          meta["dataset_sources"] = [
              s.replace("TRAINING_KAGGLE_USERNAME", u) for s in meta["dataset_sources"]
          ]
          meta_path.write_text(json.dumps(meta, indent=2))
          print("kernel-metadata.json patched:")
          print(f"  id = {meta['id']}")
          for ds in meta["dataset_sources"]:
              print(f"  dataset_source = {ds}")
          EOF

      # ── 7. Push benchmark kernel ───────────────────────────────────────────
      - name: Push benchmark kernel
        run: |
          cd orchestrator/phase0_benchmark
          kaggle kernels push -p .
          echo "Kernel pushed."

      # ── 8. Poll until complete ─────────────────────────────────────────────
      #    Polls every 90 s, up to 80 iterations (~120 min).
      #    Aborts if kernel errors or is cancelled.
      - name: Poll until complete
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          SLUG="${KAGGLE_USERNAME}/ebrain-phase0-bench"
          MAX=80
          i=0
          while [ $i -lt $MAX ]; do
            STATUS=$(kaggle kernels status "$SLUG" 2>&1)
            echo "[$i] $STATUS"
            if echo "$STATUS" | grep -qi "complete"; then
              echo "Kernel complete."
              break
            fi
            if echo "$STATUS" | grep -qiE "error|cancel"; then
              echo "ERROR: Kernel failed or was cancelled."
              echo "$STATUS"
              exit 1
            fi
            i=$((i + 1))
            sleep 90
          done
          if [ $i -ge $MAX ]; then
            echo "ERROR: Timed out waiting for kernel after $((MAX * 90))s."
            exit 1
          fi

      # ── 9. Download results ────────────────────────────────────────────────
      - name: Download results
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          SLUG="${KAGGLE_USERNAME}/ebrain-phase0-bench"
          mkdir -p orchestrator/phase0_benchmark/results
          sleep 30
          kaggle kernels output "$SLUG" -p orchestrator/phase0_benchmark/results/ || true
          if [ -f orchestrator/phase0_benchmark/results/phase0_results.txt ]; then
            echo "=== PHASE 0 RESULTS ==="
            cat orchestrator/phase0_benchmark/results/phase0_results.txt
            echo "======================="
          else
            echo "WARNING: phase0_results.txt not found in kernel output."
            echo "Available files:"
            ls -la orchestrator/phase0_benchmark/results/ || true
          fi

      # ── 10. Commit results (creates re-run guard) ──────────────────────────
      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add orchestrator/phase0_benchmark/results/
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "results: Phase 0 benchmark output [skip ci]"
            git push
            echo "Results committed."
          fi

      # ── 11. Upload as GitHub Actions artifact (always runs) ───────────────
      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-results
          path: orchestrator/phase0_benchmark/results/
          retention-days: 90
